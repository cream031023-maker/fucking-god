<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b55">
  <title>筑库 · BIM 族库协作平台</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#f5f7f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh}.topbar{height:66px;background:#fff;border-bottom:1px solid #e8ecea;display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:19px;color:#163f35}.brandmark{width:34px;height:34px;border-radius:10px;background:#176b55;color:#fff;display:grid;place-items:center;font-size:18px}.brand small{font-weight:500;color:#8a9691;font-size:12px;margin-left:4px}.topright{display:flex;align-items:center;gap:12px}.sync{font-size:12px;color:#61716a;display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:99px;background:#35aa75}.role-switch{border:1px solid #e2e8e5;border-radius:9px;padding:7px 10px;background:white;color:#43524c}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e6f4ee;color:#176b55;font-weight:700}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{padding:27px 14px;border-right:1px solid #e8ecea;min-height:calc(100vh - 66px);background:#fff}.navlabel{font-size:11px;color:#98a39e;padding:0 12px;margin:17px 0 8px;letter-spacing:.08em}.nav{width:100%;text-align:left;border:0;background:transparent;color:#65716c;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin:2px 0;display:flex;align-items:center;gap:10px}.nav.active,.nav:hover{background:#eaf5f0;color:#176b55;font-weight:650}.nav .ico{width:19px;text-align:center}.side-bottom{position:absolute;bottom:22px;font-size:12px;color:#a0aaa5;padding:0 12px}.main{padding:34px 40px 60px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px;gap:14px}.eyebrow{font-size:12px;color:#718079;margin-bottom:7px}.heading h1{font-size:26px;margin:0;color:#172d25;letter-spacing:-.03em}.sub{color:#7b8781;font-size:13px;margin:8px 0 0}.btn{border:1px solid #dce5e0;background:#fff;padding:9px 14px;border-radius:8px;color:#35453e;cursor:pointer;font-weight:600;font-size:13px}.btn:hover{border-color:#9bbbac}.btn.primary{background:#176b55;color:#fff;border-color:#176b55}.btn.primary:hover{background:#105640}.btn.danger{color:#b43d3d}.toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center}.search{flex:1;max-width:400px;border:1px solid #e1e7e4;background:#fff;border-radius:8px;padding:10px 12px;outline:none;font-size:13px}.search:focus{border-color:#6eae95}.select{border:1px solid #e1e7e4;background:white;border-radius:8px;padding:10px 12px;color:#53615b;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:23px}.stat,.panel,.card{border:1px solid #e8ecea;background:white;border-radius:11px}.stat{padding:16px 18px}.stat-label{font-size:12px;color:#87928d}.stat-value{font-size:25px;font-weight:700;color:#1c342b;margin-top:8px}.stat-note{font-size:11px;color:#36a274;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{padding:17px;transition:box-shadow .15s,transform .15s}.card:hover{box-shadow:0 8px 25px #19392a0d;transform:translateY(-2px)}.cardtop{display:flex;justify-content:space-between;align-items:flex-start}.fileicon{width:39px;height:43px;background:#eef5f1;color:#176b55;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:750}.badge{background:#e9f5ef;color:#32815f;border-radius:20px;padding:4px 8px;font-size:10px}.badge.draft{background:#fff3dd;color:#a76a13}.card h3{font-size:15px;margin:14px 0 6px}.desc{font-size:12px;line-height:1.55;color:#7a8780;min-height:38px;margin:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{font-size:10px;color:#65736c;background:#f3f5f4;border-radius:4px;padding:4px 6px}.meta{border-top:1px solid #eff1f0;padding-top:11px;display:flex;justify-content:space-between;color:#98a19c;font-size:10px}.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.textbtn{border:0;background:none;color:#176b55;cursor:pointer;font-size:12px;font-weight:650;padding:4px}.textbtn:hover{text-decoration:underline}.panel{padding:18px;margin-top:16px}.panel h2{font-size:15px;margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eef0ef;font-size:12px}th{font-weight:550;color:#89948e}td{color:#47564f}.table-title{font-weight:650;color:#293d34}.empty{grid-column:1/-1;text-align:center;color:#8a9690;padding:60px 20px;border:1px dashed #dce4df;border-radius:10px;background:white}.toast{position:fixed;right:24px;bottom:24px;background:#21392f;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 8px 30px #0002;font-size:13px;z-index:20;animation:pop .2s}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.modal-back{position:fixed;inset:0;background:#14241c66;display:grid;place-items:center;z-index:10;padding:18px}.modal{width:min(560px,100%);background:#fff;border-radius:14px;padding:23px;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:transparent;font-size:22px;color:#7f8984;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#59675f}.field input,.field select,.field textarea{font:inherit;font-size:13px;border:1px solid #dfe6e2;border-radius:7px;padding:10px;outline:none}.field textarea{resize:vertical;min-height:72px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{font-size:12px;color:#839088;line-height:1.7;margin-top:16px}.hidden{display:none!important}.syncbar{font-size:12px;color:#89958f;margin:8px 0 16px;display:flex;align-items:center;gap:7px}.syncbar strong{color:#416c59}.content{min-height:350px}.filters{display:flex;gap:7px}.filter{border:1px solid #e3e9e6;background:white;padding:8px 11px;border-radius:20px;color:#68756f;font-size:11px;cursor:pointer}.filter.active{background:#e9f5ef;border-color:#cfe9da;color:#176b55;font-weight:650}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.topbar{padding:0 15px}.brand small,.sync{display:none}.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:66px;z-index:4;min-height:0;padding:7px 10px;display:flex;overflow:auto;border-right:0;border-bottom:1px solid #e8ecea}.navlabel,.side-bottom{display:none}.nav{white-space:nowrap;width:auto;margin:0;padding:9px 12px}.main{padding:24px 15px}.heading h1{font-size:22px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat-value{font-size:21px}.toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.filters{overflow:auto}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="brandmark">筑</div>筑库 <small>BIM 族库协作平台</small></div><div class="topright"><div class="sync"><span class="dot"></span><span id="sync-label">正在连接同步服务…</span></div><select class="role-switch" id="role-switch" aria-label="切换工作端"><option value="client">客户端</option><option value="operator">操作端</option></select><div class="avatar">林</div></div></header>
  <div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div>
</div>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
  const state = { role: 'client', page: 'library', query: '', category: '全部分类', discipline: '全部专业', items: [], version: 0, updatedAt: null, connected: false };
  const main = document.querySelector('#main');
  const sidebar = document.querySelector('#sidebar');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const published = () => state.items.filter(item => item.status === 'published');
  const fmtTime = value => value ? new Date(value).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '尚未同步';
  function toast(message){const root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
  async function api(url, options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data}
  async function sync(showToast=false){try{const data=await api(`/api/library?includeDrafts=${state.role==='operator'}`);const changed=data.version!==state.version;state.items=data.items;state.version=data.version;state.updatedAt=data.updatedAt;state.connected=true;document.querySelector('#sync-label').textContent=`已同步 · ${fmtTime(data.updatedAt)}`;if(showToast)toast(changed?'已获取最新族库数据':'族库已是最新版本');render();}catch(error){state.connected=false;document.querySelector('#sync-label').textContent='同步服务未连接';if(showToast)toast(`同步失败：${error.message}`);render()}}
  function navItems(){return state.role==='operator'?[{id:'overview',icon:'▦',text:'运营总览'},{id:'manage',icon:'▤',text:'族库管理'},{id:'audit',icon:'✓',text:'发布审核'}]:[{id:'library',icon:'▦',text:'族库浏览'},{id:'downloads',icon:'↓',text:'下载记录'},{id:'favorites',icon:'♡',text:'我的收藏'}]}
  function renderSidebar(){sidebar.innerHTML=`<div style="width:100%"><div class="navlabel">${state.role==='operator'?'运营工作台':'个人工作台'}</div>${navItems().map(item=>`<button class="nav ${state.page===item.id?'active':''}" data-page="${item.id}"><span class="ico">${item.icon}</span>${item.text}</button>`).join('')}<div class="navlabel" style="margin-top:28px">${state.role==='operator'?'内容协作':'资源同步'}</div><button class="nav" data-action="sync"><span class="ico">⟳</span>立即同步</button><div class="side-bottom">筑库 BIM · 族库协作</div></div>`;sidebar.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{state.page=button.dataset.page;render()});sidebar.querySelector('[data-action="sync"]').onclick=()=>sync(true)}
  function header(title,subtitle,button=''){return `<div class="heading"><div><div class="eyebrow">${state.role==='operator'?'运营工作台':'资源中心'} / ${esc(title)}</div><h1>${esc(title)}</h1><p class="sub">${esc(subtitle)}</p></div>${button}</div>`}
  function card(item, operator=false){return `<article class="card"><div class="cardtop"><div class="fileicon">${esc(item.format||'RFA')}</div><span class="badge ${item.status==='draft'?'draft':''}">${item.status==='draft'?'草稿':'已发布'}</span></div><h3>${esc(item.name)}</h3><p class="desc">${esc(item.description||'暂无描述')}</p><div class="tags">${[item.category,item.discipline,...(item.tags||[])].slice(0,4).map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div><div class="meta"><span>版本 ${esc(item.version)} · ${esc(item.size)}</span><span>↓ ${item.downloads||0}</span></div><div class="card-actions">${operator?`<button class="textbtn" data-edit="${esc(item.id)}">${item.status==='draft'?'发布':'撤回'}</button><button class="textbtn" data-delete="${esc(item.id)}">删除</button>`:`<button class="textbtn" data-favorite="${esc(item.id)}">♡ 收藏</button><button class="btn primary" style="padding:7px 11px" data-download="${esc(item.id)}">↓ 获取族文件</button>`}</div></article>`}
  function filteredItems(items){const q=state.query.trim().toLowerCase();return items.filter(item=>(!q||[item.name,item.category,item.discipline,item.description,...(item.tags||[])].join(' ').toLowerCase().includes(q))&&(state.category==='全部分类'||item.category===state.category)&&(state.discipline==='全部专业'||item.discipline===state.discipline))}
  function listView(items,operator=false){const categories=['全部分类',...new Set(items.map(item=>item.category))];const disciplines=['全部专业',...new Set(items.map(item=>item.discipline))];return `<div class="toolbar"><input class="search" id="search" placeholder="搜索族名称、分类或关键词…" value="${esc(state.query)}"><select class="select" id="category">${categories.map(x=>`<option ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" id="discipline">${disciplines.map(x=>`<option ${state.discipline===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${operator?'<button class="btn primary" id="add-item">＋ 新增族文件</button>':''}</div><div class="syncbar"><span class="dot" style="background:${state.connected?'#35aa75':'#c48128'}"></span><span>数据版本 <strong>v${state.version}</strong> · 上次更新 ${fmtTime(state.updatedAt)} · 自动同步每 4 秒检查一次</span></div><div class="grid content">${filteredItems(items).map(item=>card(item,operator)).join('')||'<div class="empty">没有找到匹配的族文件，试试调整搜索条件。</div>'}</div>`}
  function render(){renderSidebar();if(state.role==='client')renderClient();else renderOperator();wireCommon()}
  function renderClient(){const available=published();if(state.page==='downloads'){const ids=JSON.parse(localStorage.getItem('tribe-downloads')||'[]');const items=ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean);main.innerHTML=header('下载记录','查看此浏览器中最近获取的族文件')+`<div class="grid content">${items.map(item=>card(item)).join('')||'<div class="empty">还没有获取记录。可以去族库浏览并获取族文件。</div>'}</div>`;return}if(state.page==='favorites'){const ids=JSON.parse(localStorage.getItem('tribe-favorites')||'[]');const items=ids.map(id=>state.items.find(i=>i.id===id)).filter(i=>i&&i.status==='published');main.innerHTML=header('我的收藏','收藏数据保存在当前浏览器中')+`<div class="grid content">${items.map(item=>card(item)).join('')||'<div class="empty">还没有收藏内容。点击族卡片上的“收藏”即可加入。</div>'}</div>`;return}main.innerHTML=header('族库浏览','按专业快速查找、预览并获取团队共享的 BIM 族文件。')+`<div class="stats"><div class="stat"><div class="stat-label">可用族文件</div><div class="stat-value">${available.length}</div><div class="stat-note">已发布资源</div></div><div class="stat"><div class="stat-label">专业分类</div><div class="stat-value">${new Set(available.map(i=>i.discipline)).size}</div><div class="stat-note">跨专业共享</div></div><div class="stat"><div class="stat-label">累计获取</div><div class="stat-value">${available.reduce((sum,i)=>sum+(i.downloads||0),0)}</div><div class="stat-note">所有用户合计</div></div><div class="stat"><div class="stat-label">数据状态</div><div class="stat-value" style="font-size:19px">${state.connected?'实时同步':'离线'}</div><div class="stat-note">${state.connected?'服务端数据已连接':'请检查服务连接'}</div></div></div>`+listView(available)}
  function renderOperator(){const all=state.items;const drafts=all.filter(i=>i.status==='draft');if(state.page==='overview'){main.innerHTML=header('运营总览','维护共享族库内容，审核草稿并将更新同步给客户端。','<button class="btn primary" id="add-item">＋ 新增族文件</button>')+`<div class="stats"><div class="stat"><div class="stat-label">族库总量</div><div class="stat-value">${all.length}</div><div class="stat-note">包含草稿和已发布内容</div></div><div class="stat"><div class="stat-label">已发布</div><div class="stat-value">${published().length}</div><div class="stat-note">客户端可见</div></div><div class="stat"><div class="stat-label">待审核</div><div class="stat-value">${drafts.length}</div><div class="stat-note">等待运营确认</div></div><div class="stat"><div class="stat-label">累计获取</div><div class="stat-value">${all.reduce((sum,i)=>sum+(i.downloads||0),0)}</div><div class="stat-note">服务端统计</div></div></div><div class="panel"><h2>最近更新</h2><div class="tablewrap"><table><thead><tr><th>族名称</th><th>分类 / 专业</th><th>版本</th><th>状态</th><th>更新时间</th></tr></thead><tbody>${[...all].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,6).map(i=>`<tr><td class="table-title">${esc(i.name)}</td><td>${esc(i.category)} / ${esc(i.discipline)}</td><td>${esc(i.version)}</td><td>${i.status==='draft'?'待审核':'已发布'}</td><td>${fmtTime(i.updatedAt)}</td></tr>`).join('')}</tbody></table></div></div><div class="syncbar"><span class="dot"></span>服务端版本 v${state.version} · 操作端更新会自动同步到已连接的客户端</div>`;return}if(state.page==='audit'){main.innerHTML=header('发布审核','草稿仅操作端可见；发布后会同步到客户端。')+`<div class="grid content">${drafts.map(i=>card(i,true)).join('')||'<div class="empty">暂无待审核内容。</div>'}</div>`;return}main.innerHTML=header('族库管理','管理族文件信息和发布状态。','<button class="btn primary" id="add-item">＋ 新增族文件</button>')+listView(all,true)}
  function wireCommon(){const search=document.querySelector('#search');if(search)search.oninput=()=>{state.query=search.value;const cursor=search.selectionStart;render();const next=document.querySelector('#search');next.focus();next.setSelectionRange(cursor,cursor)};const cat=document.querySelector('#category');if(cat)cat.onchange=()=>{state.category=cat.value;render()};const disc=document.querySelector('#discipline');if(disc)disc.onchange=()=>{state.discipline=disc.value;render()};const add=document.querySelector('#add-item');if(add)add.onclick=openModal;document.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>download(button.dataset.download));document.querySelectorAll('[data-favorite]').forEach(button=>button.onclick=()=>favorite(button.dataset.favorite));document.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>togglePublish(button.dataset.edit));document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>deleteItem(button.dataset.delete))}
  function openModal(){document.querySelector('#modal-root').innerHTML=`<div class="modal-back" id="backdrop"><section class="modal"><div class="modal-head"><h2>新增族库条目</h2><button class="close" id="close-modal">×</button></div><form id="item-form"><div class="form"><div class="field"><label>族名称 *</label><input name="name" required placeholder="例如：混凝土框架柱 C30"></div><div class="field"><label>分类 *</label><input name="category" required placeholder="例如：结构构件"></div><div class="field"><label>所属专业</label><input name="discipline" placeholder="结构 / 建筑 / 电气"></div><div class="field"><label>文件格式</label><select name="format"><option>RFA</option><option>RVT</option><option>IFC</option><option>DWG</option></select></div><div class="field"><label>版本</label><input name="version" value="1.0"></div><div class="field"><label>文件大小</label><input name="size" placeholder="待上传"></div><div class="field full"><label>关键词（逗号分隔）</label><input name="tags" placeholder="例如：柱,混凝土"></div><div class="field full"><label>描述</label><textarea name="description" placeholder="介绍族文件用途、参数等"></textarea></div><div class="field"><label>初始状态</label><select name="status"><option value="published">直接发布</option><option value="draft">保存为草稿</option></select></div></div><p class="notice">演示版本管理元数据，不含真实族文件上传/下载。新建条目将写入服务端数据并自动同步。</p><div class="modal-actions"><button type="button" class="btn" id="cancel-modal">取消</button><button class="btn primary" type="submit">保存条目</button></div></form></section></div>`;const close=()=>document.querySelector('#modal-root').innerHTML='';document.querySelector('#close-modal').onclick=close;document.querySelector('#cancel-modal').onclick=close;document.querySelector('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.querySelector('#item-form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/items',{method:'POST',body:JSON.stringify(data)});close();await sync();toast('族库条目已保存并同步')}catch(error){toast(error.message)}}}
  async function download(id){try{await api(`/api/items/${encodeURIComponent(id)}/download`,{method:'POST'});const ids=JSON.parse(localStorage.getItem('tribe-downloads')||'[]');localStorage.setItem('tribe-downloads',JSON.stringify([id,...ids.filter(x=>x!==id)]));await sync();toast('已记录获取操作（演示版不含实际文件）')}catch(error){toast(error.message)}}
  function favorite(id){const ids=JSON.parse(localStorage.getItem('tribe-favorites')||'[]');const next=ids.includes(id)?ids.filter(x=>x!==id):[id,...ids];localStorage.setItem('tribe-favorites',JSON.stringify(next));toast(next.includes(id)?'已加入收藏':'已取消收藏')}
  async function togglePublish(id){const item=state.items.find(i=>i.id===id);if(!item)return;try{await api(`/api/items/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({status:item.status==='draft'?'published':'draft'})});await sync();toast(item.status==='draft'?'已发布并同步到客户端':'已撤回到草稿')}catch(error){toast(error.message)}}
  async function deleteItem(id){const item=state.items.find(i=>i.id===id);if(!item||!confirm(`确定删除“${item.name}”？`))return;try{await api(`/api/items/${encodeURIComponent(id)}`,{method:'DELETE'});await sync();toast('条目已删除并同步')}catch(error){toast(error.message)}}
  document.querySelector('#role-switch').onchange=e=>{state.role=e.target.value;state.page=state.role==='operator'?'overview':'library';state.query='';state.category='全部分类';state.discipline='全部专业';sync()};
  sync();setInterval(()=>sync(),4000);
</script>
</body>
</html>
